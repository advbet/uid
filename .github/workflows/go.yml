name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --enable-only=govet,unused

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -failfast -timeout 60s -v ./...
